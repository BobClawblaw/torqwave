<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="1600" height="900" fill="#111317"/>
<text x="50.0" y="76.0" font-size="44" fill="#ffffff" text-anchor="start" font-weight="bold">Torqwave 0.22.0: what it adds over 0.21.1</text>
<text x="50.0" y="116.0" font-size="23" fill="#8b939e" text-anchor="start" font-weight="normal">By the numbers, counted from the release&#x27;s own files and documentation</text>
<text x="1550.0" y="872.0" font-size="17" fill="#6b737d" text-anchor="end" font-weight="normal">As of 2026-11-26. Torqwave 0.22.0 is released. Sources and method: docs/compare in the Torqwave repository.</text>
<rect x="50.0" y="160.0" width="320.0" height="300.0" rx="10" fill="#16191d" stroke="#2a2f36" stroke-width="1.5"/>
<rect x="50.0" y="160.0" width="320.0" height="5.0" rx="2" fill="#4fc3a1"/>
<text x="74.0" y="268.0" font-size="84" fill="#4fc3a1" text-anchor="start" font-weight="bold">9</text>
<text x="74.0" y="316.0" font-size="28" fill="#ffffff" text-anchor="start" font-weight="bold">Synth oscillators</text>
<text x="74.0" y="354.0" font-size="22" fill="#8b939e" text-anchor="start" font-weight="normal">0.21.1: 3</text>
<text x="74.0" y="390.0" font-size="18" fill="#6b737d" text-anchor="start" font-weight="normal">each can drive another&#x27;s FM</text>
<rect x="390.0" y="160.0" width="320.0" height="300.0" rx="10" fill="#16191d" stroke="#2a2f36" stroke-width="1.5"/>
<rect x="390.0" y="160.0" width="320.0" height="5.0" rx="2" fill="#4fc3a1"/>
<text x="414.0" y="268.0" font-size="84" fill="#4fc3a1" text-anchor="start" font-weight="bold">58</text>
<text x="414.0" y="316.0" font-size="28" fill="#ffffff" text-anchor="start" font-weight="bold">Complex patches</text>
<text x="414.0" y="354.0" font-size="22" fill="#8b939e" text-anchor="start" font-weight="normal">0.21.1: 0</text>
<text x="414.0" y="390.0" font-size="18" fill="#6b737d" text-anchor="start" font-weight="normal">four oscillators or more, two</text>
<text x="414.0" y="414.0" font-size="18" fill="#6b737d" text-anchor="start" font-weight="normal">a category</text>
<rect x="730.0" y="160.0" width="320.0" height="300.0" rx="10" fill="#16191d" stroke="#2a2f36" stroke-width="1.5"/>
<rect x="730.0" y="160.0" width="320.0" height="5.0" rx="2" fill="#4fc3a1"/>
<text x="754.0" y="268.0" font-size="84" fill="#4fc3a1" text-anchor="start" font-weight="bold">3,569</text>
<text x="754.0" y="316.0" font-size="28" fill="#ffffff" text-anchor="start" font-weight="bold">Factory patches</text>
<text x="754.0" y="354.0" font-size="22" fill="#8b939e" text-anchor="start" font-weight="normal">0.21.1: 3,743</text>
<text x="754.0" y="390.0" font-size="18" fill="#6b737d" text-anchor="start" font-weight="normal">174 near-copies taken out</text>
<rect x="50.0" y="480.0" width="320.0" height="300.0" rx="10" fill="#16191d" stroke="#2a2f36" stroke-width="1.5"/>
<rect x="50.0" y="480.0" width="320.0" height="5.0" rx="2" fill="#4fc3a1"/>
<text x="74.0" y="588.0" font-size="84" fill="#4fc3a1" text-anchor="start" font-weight="bold">1,024</text>
<text x="74.0" y="636.0" font-size="28" fill="#ffffff" text-anchor="start" font-weight="bold">Sequence presets</text>
<text x="74.0" y="674.0" font-size="22" fill="#8b939e" text-anchor="start" font-weight="normal">0.21.1: 1,032</text>
<text x="74.0" y="710.0" font-size="18" fill="#6b737d" text-anchor="start" font-weight="normal">in 37 styles, with 116 starter</text>
<text x="74.0" y="734.0" font-size="18" fill="#6b737d" text-anchor="start" font-weight="normal">kits</text>
<rect x="390.0" y="480.0" width="320.0" height="300.0" rx="10" fill="#16191d" stroke="#2a2f36" stroke-width="1.5"/>
<rect x="390.0" y="480.0" width="320.0" height="5.0" rx="2" fill="#4fc3a1"/>
<text x="414.0" y="588.0" font-size="84" fill="#4fc3a1" text-anchor="start" font-weight="bold">0</text>
<text x="414.0" y="636.0" font-size="28" fill="#ffffff" text-anchor="start" font-weight="bold">Presets sharing notes</text>
<text x="414.0" y="674.0" font-size="22" fill="#8b939e" text-anchor="start" font-weight="normal">0.21.1: 446</text>
<text x="414.0" y="710.0" font-size="18" fill="#6b737d" text-anchor="start" font-weight="normal">a test fails if a repeat comes</text>
<text x="414.0" y="734.0" font-size="18" fill="#6b737d" text-anchor="start" font-weight="normal">back</text>
<rect x="730.0" y="480.0" width="320.0" height="300.0" rx="10" fill="#16191d" stroke="#2a2f36" stroke-width="1.5"/>
<rect x="730.0" y="480.0" width="320.0" height="5.0" rx="2" fill="#4fc3a1"/>
<text x="754.0" y="588.0" font-size="84" fill="#4fc3a1" text-anchor="start" font-weight="bold">29</text>
<text x="754.0" y="636.0" font-size="28" fill="#ffffff" text-anchor="start" font-weight="bold">Patches on all nine</text>
<text x="754.0" y="674.0" font-size="22" fill="#8b939e" text-anchor="start" font-weight="normal">0.21.1: 0</text>
<text x="754.0" y="710.0" font-size="18" fill="#6b737d" text-anchor="start" font-weight="normal">one in each category</text>
<rect x="1080.0" y="160.0" width="470.0" height="620.0" rx="10" fill="#1d2126" stroke="#2a2f36" stroke-width="1.5"/>
<text x="1108.0" y="212.0" font-size="28" fill="#ffffff" text-anchor="start" font-weight="bold">Also new since 0.21.1</text>
<rect x="1108.0" y="248.0" width="8.0" height="8.0" rx="2" fill="#4a9fe0"/>
<text x="1130.0" y="260.0" font-size="21" fill="#d8dde3" text-anchor="start" font-weight="normal">Nine wavetable oscillators in</text>
<text x="1130.0" y="288.0" font-size="21" fill="#d8dde3" text-anchor="start" font-weight="normal">Torqwave Synth</text>
<rect x="1108.0" y="321.0" width="8.0" height="8.0" rx="2" fill="#4a9fe0"/>
<text x="1130.0" y="333.0" font-size="21" fill="#d8dde3" text-anchor="start" font-weight="normal">FM from any oscillator, two and</text>
<text x="1130.0" y="361.0" font-size="21" fill="#d8dde3" text-anchor="start" font-weight="normal">three deep</text>
<rect x="1108.0" y="394.0" width="8.0" height="8.0" rx="2" fill="#4a9fe0"/>
<text x="1130.0" y="406.0" font-size="21" fill="#d8dde3" text-anchor="start" font-weight="normal">A Complex folder of patches that use</text>
<text x="1130.0" y="434.0" font-size="21" fill="#d8dde3" text-anchor="start" font-weight="normal">them</text>
<rect x="1108.0" y="467.0" width="8.0" height="8.0" rx="2" fill="#4a9fe0"/>
<text x="1130.0" y="479.0" font-size="21" fill="#d8dde3" text-anchor="start" font-weight="normal">No click when a held sound is struck</text>
<text x="1130.0" y="507.0" font-size="21" fill="#d8dde3" text-anchor="start" font-weight="normal">again</text>
<rect x="1108.0" y="540.0" width="8.0" height="8.0" rx="2" fill="#4a9fe0"/>
<text x="1130.0" y="552.0" font-size="21" fill="#d8dde3" text-anchor="start" font-weight="normal">A Sequence Library with no two</text>
<text x="1130.0" y="580.0" font-size="21" fill="#d8dde3" text-anchor="start" font-weight="normal">presets alike</text>
<rect x="1108.0" y="613.0" width="8.0" height="8.0" rx="2" fill="#4a9fe0"/>
<text x="1130.0" y="625.0" font-size="21" fill="#d8dde3" text-anchor="start" font-weight="normal">Drones and pads levelled, from their</text>
<text x="1130.0" y="653.0" font-size="21" fill="#d8dde3" text-anchor="start" font-weight="normal">first bar</text>
<rect x="1108.0" y="686.0" width="8.0" height="8.0" rx="2" fill="#4a9fe0"/>
<text x="1130.0" y="698.0" font-size="21" fill="#d8dde3" text-anchor="start" font-weight="normal">Styles, kits and patterns named for</text>
<text x="1130.0" y="726.0" font-size="21" fill="#d8dde3" text-anchor="start" font-weight="normal">what they play</text>
</svg>
