# The site (GitHub Pages, from this folder). Pages build it with Jekyll: Markdown pages (the user
# guide and the rest) take _layouts/default.html, and so do the HTML pages that start with front matter.
title: Torqwave
description: A free, open-source audio editor and DAW in one, for macOS, Windows and Linux.
# The release the download buttons name. Change it when a release is published.
version: "0.24.0"
repository: BobClawblaw/torqwave
# Where the site is served, for the links and the picture a shared page shows (Open Graph, X cards).
address: https://bobclawblaw.github.io/torqwave
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-readme-index
exclude:
  - build_pages.py
